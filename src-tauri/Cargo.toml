[package]
name = "dynamic-island"
version = "0.1.0"
description = "Dynamic Island para Windows"
authors = ["Lucas Fernández Carrasco"]
edition = "2021"

[lib]
# El sufijo `_lib` evita el conflicto de nombres con el binario en Windows.
name = "dynamic_island_lib"
crate-type = ["rlib"]  # sin cdylib: con MinGW supera el límite de 65535 exports

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
] }

# Binario pequeño: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
