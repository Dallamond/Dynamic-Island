<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icono de Dynamic Island: la píldora negra sobre un fondo degradado. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5f8f"/>
      <stop offset="0.55" stop-color="#232b40"/>
      <stop offset="1" stop-color="#11141d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#shine)"/>
  <rect x="172" y="380" width="680" height="264" rx="132" fill="#000"/>
  <circle cx="304" cy="512" r="58" fill="#d97757"/>
  <rect x="408" y="486" width="250" height="52" rx="26" fill="#ffffff" opacity=".9"/>
  <circle cx="740" cy="512" r="30" fill="#30d158"/>
</svg>
